[ai]
# Ollama model to use
model = gemma4:e4b

# Enable thinking (if model supports)
think = true

# Allow model to use tools (if supported)
# tools are any interactions friday can do:
#  Search internet, run shell commands, search files, 
#  open content in apps, search history database, 
#  see selected content from clipboard, paste to clipboard,
#  open given media files, wipe context (active chat),
#  read and write to files. For full list see src/friday/tools.py
use_tools = true

# Keep model in memory for N minutes after a message
keep_alive = 30m

# Top limit of firday's context window (in tokens)
# If model does not reply to your request / hallucinate, try increasing it
# unlimited -> use model's top limit
num_ctx = 16384

[tts]
# Text to speech model (AI voice)
model_path = ~/.config/friday/voices/kokoro-v1.0.onnx
voices_path = ~/.config/friday/voices/voices-v1.0.bin

# The voice to use, see https://huggingface.co/hexgrad/Kokoro-82M/blob/main/VOICES.md
voice = af_heart

# Language to speak. (also needs corresponding voice)
# You might want to change misc.thinking_quotes too
# en-us -> American English
# en-gb -> British English 
#  es   -> Spanish
#  fr   -> French
#  it   -> Italian 
#  ja   -> Japanese
language = en-us

# Speech speed
speed = 1.0 

# Prefer computing on CPU instead of GPU
prefer_cpu = false

# Preload speech model on startup
preload = true

# Unload speech model after 1 minute idle
unload_after = 1m

[stt]
# Speech to text (Voice recognition model) uses faster-whisper.
# See https://github.com/openai/whisper#available-models-and-languages
model = small.en

# Prefer computing on CPU instead of GPU
prefer_cpu = false 

# Preload voice recognition model on startup
preload = false

# Unload after 5 minutes idle
unload_after = 5m

[misc]
rich_formatting = true

# The method / library to use for web searching available options:
# none    -> model won't be able to search the internet
# ddgs    -> python library, local, best option
# ollama  -> use default ollama web search functions (external, requires OLLAMA_API_KEY)
# searxng -> searxng local server, provide url endpoint, requires json API to be enabled,
#            requires installing the following libs: requests, trafilatura (for web_fetch)
web_search_provider = ddgs

searxng_url = http://localhost:8888/

# Friday can take a screenshot of your screen (yes, only if you ask it to)
# given script should print screenshot path to stdout on success
# Note that screenshots will not be automatically deleted later. 
screenshot_cmd = ~/.local/bin/screenshot

# Amount of turns to forcefully keep in memory.
# Turn is a full round of user prompt - model response, tool calls
keep_recent_turns = 3

# Tokens kept available in the context window for friday's replies and tool use.
# Older conversation history is saved to a database that friday has access to.
context_reserve = 2000

# Send various notifications (e.g reply message, listening status, etc)
# requires notify-send
send_notifications = true

# Max length of tool response in characters (helps preventing context overflows) 
# When tool response is bigger than this limit, returns: 
#  "Too big response, try shorter request"
# model can re-run same tool but with other params to get less content
# unlimited -> no limits
max_tool_response_length = 20000

# If content is too big, trim it to size of max_tool_response_length instead
max_response_trim_content = true

# When running the daemon, log the thinking process of the model
log_thinking = false

# The active chat history is stored in a file.
# If set to true - wipe chat from previous run
# Note:
#  You can wipe it from cli by using -w argument or
#  you can ask friday to wipe its context
wipe_chat_on_daemon_startup = false

# List of quotes that friday says while thinking. 
# separate with ;
thinking_quotes = 
