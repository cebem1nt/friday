[ai]
model = gemma4:e4b
think = true
keep_alive = 30m

[tts]
# Text to speech model (AI voice)
model_path = ~/voices/en_US-ljspeech-high.onnx
voice_scale = 0.7 # Lower -> faster speech


[stt]
# Speech to text (Voice recognition model) uses openAI whisper.
# See https://github.com/openai/whisper#available-models-and-languages
model = small.en

[misc]
rich_formatting = true